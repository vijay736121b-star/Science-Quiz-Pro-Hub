name: Restore Release Keystore

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  restore-keystore:
    runs-on: ubuntu-latest

    steps:
      - name: Restore JKS from Base64
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > science-quiz-pro-upload.jks
          chmod 600 science-quiz-pro-upload.jks

      - name: Verify keystore file
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          keytool -list \
            -keystore science-quiz-pro-upload.jks \
            -storepass "$STORE_PASSWORD" \
            -alias "$KEY_ALIAS" \
            -v | grep -E "Alias name:|Entry type:|Owner:|SHA256:"

      - name: Upload JKS temporarily
        uses: actions/upload-artifact@v4
        with:
          name: Science-Quiz-Pro-Release-Keystore
          path: science-quiz-pro-upload.jks
          retention-days: 1
