name: Generate Release Signing Key

on:
  workflow_dispatch:

jobs:
  generate-keystore:
    runs-on: ubuntu-latest

    steps:
      - name: Generate keystore
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          keytool -genkeypair -v \
            -keystore science-quiz-pro-upload.jks \
            -storetype JKS \
            -alias "$KEY_ALIAS" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "$STORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -dname "CN=Science Quiz Pro, O=Science Quiz Pro, L=Alipurduar, ST=West Bengal, C=IN"

      - name: Convert keystore to Base64
        run: |
          base64 -w 0 science-quiz-pro-upload.jks > KEYSTORE_BASE64.txt

      - name: Upload signing key
        uses: actions/upload-artifact@v4
        with:
          name: Science-Quiz-Pro-Signing-Key
          path: KEYSTORE_BASE64.txt
          retention-days: 1
